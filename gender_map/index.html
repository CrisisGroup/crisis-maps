<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Gender Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
    <link rel="stylesheet" href="https://use.typekit.net/nqh8ygh.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <a href="https://www.crisisgroup.org" target="_blank" rel="noopener noreferrer"><img id="yearlogo" src="images/icg.png" alt="International Crisis Group" /></a>
    <div id="map" aria-label="Gender and conflict research map"></div>
    <div id="load-status" role="status">Loading map…</div>
    <noscript>This map requires JavaScript.</noscript>
    <script>// Function to close sidebar
        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const restoreFocus = sidebar.contains(document.activeElement);
            sidebar.classList.remove('open');
            sidebar.inert = true;
            if (restoreFocus) document.getElementById('timeline').focus();
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeSidebar();
        });

        // Click outside to close sidebar
        document.addEventListener('click', (event) => {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open') && !sidebar.contains(event.target) && !event.target.closest('.mapboxgl-canvas')) {
                closeSidebar();
            }
        });</script>
    <div id="sidebar" role="region" aria-labelledby="sidebar-title" inert>
        <button class="close-btn" aria-label="Close country details" onclick="closeSidebar()">×</button>
        <p class="eyebrow">Gender &amp; conflict / Research</p>
        <h3 id="sidebar-title">Country Info</h3>
        <div id="sidebar-content">Select a country to view details.</div>
    </div>

    <section class="map-panel" aria-label="Map legend and timeline">
        <div class="legend">
            <p class="eyebrow">International Crisis Group</p>
            <h1>Gender &amp; conflict</h1>
            <p class="legend-key"><i aria-hidden="true"></i>Countries covered by our research</p>
            <a href="https://www.crisisgroup.org/gender-and-conflict" target="_blank" rel="noopener noreferrer">Explore our work <span aria-hidden="true">↗</span></a>
        </div>
        <div id="controls">
            <div class="timeline-heading">
                <label for="timeline" class="eyebrow">Research through</label>
                <output id="year-display" for="timeline">Loading…</output>
            </div>
            <input type="range" id="timeline" aria-label="Research through year" disabled min="0" max="0" value="0" />
            <div class="timeline-labels" aria-hidden="true"><span id="first-year"></span><span id="last-year"></span></div>
            <p class="timeline-help">Choose a year, then select a highlighted country.</p>
        </div>
    </section>
    <script>

        document.addEventListener('DOMContentLoaded', () => {

            const status = document.getElementById('load-status');
            function showError(message) {
                status.hidden = false;
                status.textContent = message;
            }
            if (location.protocol === 'file:') {
                showError('Start python3 serve.py and open the localhost URL to view this map.');
                return;
            }
            if (!window.mapboxgl || !mapboxgl.supported()) {
                showError('The map could not start. Check your internet connection and WebGL browser support, then reload.');
                return;
            }

            mapboxgl.accessToken = 'pk.eyJ1IjoiZGFsdG9ud2IiLCJhIjoiOWdSSXFQSSJ9.HZyjh4g3TAAOAncwelv9Vw'; // Replace with your actual Mapbox token

            const sidebar = document.getElementById('sidebar');
            const timeline = document.getElementById('timeline');
            const yearDisplay = document.getElementById('year-display');

            const sliderHint = document.createElement("div");
            sliderHint.id = "slider-hint";
            sliderHint.innerText = "Drag the timeline to explore";
            document.getElementById("controls").appendChild(sliderHint);

            setTimeout(() => {
                sliderHint.classList.add("hidden"); // Auto-hide after a few seconds
            }, 4000);

            timeline.addEventListener("input", () => {
                sliderHint.classList.add("hidden"); // Hide when user interacts
            });

            if (!sidebar || !timeline || !yearDisplay) {
                console.error('Required DOM elements (sidebar, timeline, or year-display) are missing.');
                return;
            }

            function updateSliderBackground() {
                const span = timeline.max - timeline.min;
                const progress = (span > 0 ? ((timeline.value - timeline.min) / span) * 100 : 100) + '%';
                timeline.style.background = `linear-gradient(to right, #ee7143 0%, #ee7143 ${progress}, #d9dedf ${progress}, #d9dedf 100%)`;
            }

            function parseDateValues(rawDates) {
                if (Array.isArray(rawDates)) {
                    return rawDates.map((date) => parseInt(date, 10)).filter(Number.isFinite);
                }

                if (typeof rawDates === 'string') {
                    return rawDates
                        .split(/\s*;\s*/)
                        .map((date) => parseInt(date.trim(), 10))
                        .filter(Number.isFinite);
                }

                const parsedDate = parseInt(rawDates, 10);
                return Number.isFinite(parsedDate) ? [parsedDate] : [];
            }

            // Attach event listener
            timeline.addEventListener('input', updateSliderBackground);

            // Call function once to set initial state
            updateSliderBackground();


            const map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/daltonwb/cm7oudlgp001f01r128258k8p',
                center: [0, 20],
                zoom: 1.5,
                attributionControl: false,
                cooperativeGestures: true,
                maxZoom: 4,
                maxBounds: [[-180, -85], [180, 85]]
            });

            map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-left');

            map.addControl(new mapboxgl.AttributionControl({
                customAttribution: 'International Crisis Group | Map by <a href="https://www.linkedin.com/in/pkfranz" target="_blank" rel="noopener noreferrer">Paul Franz</a> and Claire Boccon-Gibod'
            }));

            const mapReady = new Promise((resolve) => map.on('load', resolve));
            map.on('error', () => showError('Some map resources could not load. Check your connection and Mapbox token permissions, then reload.'));

            fetch('data/countries_2026_clean.geojson')
                .then((response) => {
                    if (!response.ok) throw new Error(`Data request failed: ${response.status}`);
                    return response.json();
                })
                .then(async (data) => {
                    if (!Array.isArray(data.features) || !data.features.length) throw new Error('No country data');
                    // Source IDs contain duplicates; assign unique runtime IDs without changing the dataset.
                    data.features.forEach((feature, index) => { feature.id = index; });
                    await mapReady;
                    {
                        map.addSource('countries', {
                            type: 'geojson',
                            data: data,
                        });

                        map.addLayer({
                            id: 'countries-fill',
                            type: 'fill',
                            source: 'countries',
                            paint: {
                                'fill-color': [
                                    'case',
                                    ['boolean', ['feature-state', 'highlight'], false],
                                    '#ee7143',
                                    '#cccccc',
                                ],
                                'fill-opacity': [
                                    'case',
                                    ['boolean', ['feature-state', 'highlight'], false],
                                    1,
                                    0,
                                ],
                            },
                        });

                        map.addLayer({
                            id: 'countries-outline',
                            type: 'line',
                            source: 'countries',
                            paint: {
                                'line-color': [
                                    'case',
                                    ['boolean', ['feature-state', 'highlight'], false],
                                    '#ffffff',
                                    '#333333',
                                ],
                                'line-width': [
                                    'case',
                                    ['boolean', ['feature-state', 'highlight'], false],
                                    1,
                                    0,
                                ],
                            },
                        });

                        // Build a full year range so the slider reaches the latest article year (2026+).
                        const firstYears = data.features
                            .map((feature) => parseInt(feature.properties.first_date, 10))
                            .filter(Number.isFinite);
                        const articleYears = data.features.flatMap((feature) => parseDateValues(feature.properties.dates));
                        const minYear = firstYears.length > 0
                            ? Math.min(...firstYears)
                            : (articleYears.length > 0 ? Math.min(...articleYears) : null);
                        const maxYear = articleYears.length > 0
                            ? Math.max(...articleYears)
                            : (firstYears.length > 0 ? Math.max(...firstYears) : null);
                        const years = minYear !== null && maxYear !== null && maxYear >= minYear
                            ? Array.from({ length: maxYear - minYear + 1 }, (_, index) => minYear + index)
                            : [];

                        if (years.length > 0) {
                            timeline.disabled = false;
                            status.hidden = true;
                            timeline.max = years.length - 1;
                            document.getElementById('first-year').textContent = years[0];
                            document.getElementById('last-year').textContent = years[years.length - 1];

                            // Default to the latest year available in the data.
                            const initialIndex = years.length - 1;
                            timeline.value = initialIndex;
                            yearDisplay.textContent = years[timeline.value];
                            timeline.setAttribute('aria-valuetext', String(years[timeline.value]));

                            // Ensure the slider background is correct on load
                            updateSliderBackground();

                            const updateMap = (year) => {
                                data.features.forEach((feature) => {
                                    map.setFeatureState(
                                        { source: 'countries', id: feature.id },
                                        { highlight: feature.properties.first_date <= year }
                                    );
                                });
                            };

                            timeline.addEventListener('input', (event) => {
                                const year = years[parseInt(event.target.value, 10)];
                                yearDisplay.textContent = year;
                                timeline.setAttribute('aria-valuetext', String(year));
                                closeSidebar();
                                updateMap(year);
                            });

                            updateMap(years[timeline.value]); // Initialize map at the latest year
                        } else {
                            yearDisplay.textContent = 'No Data';
                            showError('No publication years are available.');
                        }

                        // Click event for country selection
                        map.on('click', 'countries-fill', (e) => {
                            if (!e.features || e.features.length === 0) {
                                console.warn('No features found on click.');
                                return;
                            }

                            const properties = e.features[0].properties;
                            const isHighlighted = map.getFeatureState({ source: 'countries', id: e.features[0].id }).highlight;
                            if (!isHighlighted) {
                                console.warn('Clicked country is not highlighted.');
                                return;
                            }

                            // Extract articles, links, and dates
                            const titles = properties.title.split(/\s*;\s*/);
                            const links = properties.links.split(/\s*;\s*/);
                            const dates = parseDateValues(properties.dates);

                            // Combine into an array of objects and sort by date (ascending order)
                            const sortedArticles = titles.map((title, index) => ({
                                title,
                                link: links[index],
                                date: dates[index]
                            })).sort((a, b) => a.date - b.date); // Sort by earliest date first

                            const content = document.getElementById('sidebar-content');
                            content.replaceChildren();
                            const firstDate = document.createElement('p');
                            firstDate.className = 'first-pub';
                            firstDate.textContent = `Research since ${properties.first_date}`;
                            const heading = document.createElement('p');
                            heading.className = 'article-heading';
                            heading.textContent = 'Publications · All years';
                            const list = document.createElement('ul');
                            sortedArticles.forEach((article) => {
                                if (!article.title.trim()) return;
                                const item = document.createElement('li');
                                const link = document.createElement('a');
                                link.textContent = article.title;
                                try {
                                    const url = new URL(article.link);
                                    if (['http:', 'https:'].includes(url.protocol)) {
                                        link.href = url.href;
                                        link.target = '_blank';
                                        link.rel = 'noopener noreferrer';
                                    }
                                } catch { /* Keep the title readable if a source URL is missing. */ }
                                const year = document.createElement('span');
                                year.className = 'article-year';
                                year.textContent = article.date ?? 'Year unavailable';
                                item.append(year, link);
                                list.append(item);
                            });
                            content.append(firstDate, heading, list);
                            document.getElementById('sidebar-title').textContent = properties.name;

                            // Open sidebar
                            sidebar.inert = false;
                            sidebar.classList.add('open');
                            sidebar.querySelector('.close-btn').focus();
                        });

                        // Change cursor on hover
                        map.on('mousemove', 'countries-fill', (event) => {
                            const feature = event.features?.[0];
                            const active = feature && map.getFeatureState({ source: 'countries', id: feature.id }).highlight;
                            map.getCanvas().style.cursor = active ? 'pointer' : '';
                        });

                        map.on('mouseleave', 'countries-fill', () => {
                            map.getCanvas().style.cursor = '';
                        });
                    }
                })
                .catch((error) => {
                    console.error('Error loading map:', error);
                    showError('Country data could not load. Check your connection and reload the page.');
                });

        });
    </script>
</body>

</html>
